# The main pipeline for project_bundle

resources:
  pipelines:
    bronze_to_silver_earthquake_etl:
      name: Bronze_to_Silver
      configuration:
        catalog_name: ${var.catalog}
      libraries:
        - glob:
            include: ../src/DLT_pipelines/Bronze_to_Silver_Earthquake/transformations/**
      schema: silver
      continuous: false
      development: false
      photon: true
      channel: CURRENT
      catalog: ${var.catalog}
      serverless: true
      root_path: ../src/DLT_pipelines/Bronze_to_Silver_Earthquake
